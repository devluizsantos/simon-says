<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simon Says!</title>
    <link rel="stylesheet" href="assets/style/style.css">
    <link rel="icon" type="image/png" href="assets/images/logo.ico">
</head>
<body>
    <div id="screen">
        <div id="scoreboard">
            <div class="scoreBox">
                <h1 class="score">Score:</h1>
                <p id="newScore">0</p>
            </div>
            <div class="scoreBox">
                <h1 class="score">Hight Score:</h1>
                <p id="highScore">0</p>
            </div>
        </div>

        <div id="display">
            <div id="btnDisplay">
                <button id="red" class="btnColor"></button>
                <button id="green" class="btnColor"></button>
                <button id="blue" class="btnColor"></button>
                <button id="yellow" class="btnColor"></button>
            </div>
            <button id="start">Start</button>
        </div>
    </div>
    <script src="assets/script/script.js"></script>
</body>
</html>
